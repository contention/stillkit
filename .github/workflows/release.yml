name: Release

# Tags and releases StillKit whenever VERSION changes on main.
#
# To release: put the new version in VERSION (for example 0.1.0) in the same commit as the
# changes it ships, and push to main. This builds the package, then creates the tag and a
# GitHub release with generated notes. Tags have no "v" prefix, matching the existing ones.
#
# A version that is already tagged is skipped, so reverting VERSION never re-releases.
# A version lower than the latest tag fails the run.
#
# Release notes come from GitHub's generator, which depends on the pull request service.
# If that is down, the notes fall back to the commit list, so a release never waits on notes.
# Creating the release is retried, since the releases API can fail during GitHub outages.

on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Read version
        id: version
        run: |
          version=$(tr -d '[:space:]' < VERSION)

          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error file=VERSION::'$version' is not a version like 1.2.3"
            exit 1
          fi

          if git rev-parse -q --verify "refs/tags/$version" >/dev/null; then
            echo "::notice file=VERSION::$version is already tagged, so there is nothing to release."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          latest=$(git tag --list '[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -n 1)
          highest=$(printf '%s\n%s\n' "$latest" "$version" | sort -V | tail -n 1)
          if [[ -n "$latest" && "$highest" != "$version" ]]; then
            echo "::error file=VERSION::$version is lower than the latest tag, $latest"
            exit 1
          fi

          echo "Releasing $version (latest tag: ${latest:-none})"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "previous=$latest" >> "$GITHUB_OUTPUT"
          echo "release=true" >> "$GITHUB_OUTPUT"

      - name: Build
        if: steps.version.outputs.release == 'true'
        run: xcodebuild -scheme StillKit -destination 'generic/platform=iOS Simulator' build

      - name: Tag and release
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          PREVIOUS: ${{ steps.version.outputs.previous }}
        run: |
          fields=(-f tag_name="$VERSION" -f target_commitish="$GITHUB_SHA")
          range="$GITHUB_SHA"
          if [[ -n "$PREVIOUS" ]]; then
            fields+=(-f previous_tag_name="$PREVIOUS")
            range="$PREVIOUS..$GITHUB_SHA"
          fi

          if ! notes=$(gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" "${fields[@]}" --jq .body) \
              || [[ -z "$notes" ]]; then
            echo "::warning::GitHub could not generate release notes; using the commit list instead."
            notes="## Changes"$'\n\n'"$(git log --no-merges --pretty='- %s' "$range")"
          fi

          for attempt in 1 2 3 4 5; do
            if gh release view "$VERSION" >/dev/null 2>&1; then
              echo "Released $VERSION."
              exit 0
            fi
            if gh release create "$VERSION" --target "$GITHUB_SHA" --title "$VERSION" --notes "$notes"; then
              echo "Released $VERSION."
              exit 0
            fi
            echo "::warning::Creating the release failed (attempt $attempt of 5); retrying in 30 seconds."
            sleep 30
          done

          echo "::error::Could not create the release. Re-run this workflow once GitHub is healthy."
          exit 1
