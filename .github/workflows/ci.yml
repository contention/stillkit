name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build StillKit package
        run: xcodebuild -scheme StillKit -destination 'generic/platform=iOS Simulator' build

      - name: Run StillKit unit tests
        run: |
          SIM_ID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          for runtime, devices in sorted(data.get('devices', {}).items(), reverse=True):
              if 'iOS' not in runtime:
                  continue
              for d in devices:
                  if d.get('isAvailable') and 'iPhone' in d.get('name', ''):
                      print(d['udid'])
                      sys.exit(0)
          ")
          echo "Using simulator: $SIM_ID"
          xcodebuild -scheme StillKit -destination "id=$SIM_ID" test

      - name: Build StillShowcase
        run: xcodebuild -project Showcase/StillShowcase.xcodeproj -scheme StillShowcase -destination 'generic/platform=iOS Simulator' build

      - name: Test still-setup CLI and template build
        run: bash scripts/test-setup.sh
